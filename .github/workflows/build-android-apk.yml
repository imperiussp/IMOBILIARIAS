name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_SUPABASE_URL: "https://rvjsonspplqelktzwusu.supabase.co"
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_jhqdOH3X4FPkxjKTY-EnUQ_37mUhy4z"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check mobile TypeScript
        run: pnpm --filter @imobiliarias/mobile typecheck

      - name: Generate Android project
        run: pnpm --filter @imobiliarias/mobile exec expo prebuild --platform android --clean

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk LENOY-IMOBILIARIAS-TESTE-OFFLINE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LENOY-IMOBILIARIAS-ANDROID-TESTE
          path: LENOY-IMOBILIARIAS-TESTE-OFFLINE.apk
          if-no-files-found: error
          retention-days: 7
