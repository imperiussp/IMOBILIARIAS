# Backup operacional do Supabase IMOBILIARIAS
name: Backup Supabase

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: backup-supabase
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://rvjsonspplqelktzwusu.supabase.co
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate backup secrets
        shell: bash
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_DB_URL secret"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing SUPABASE_SERVICE_ROLE_KEY secret"; exit 1; }

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Create database backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup/database backup/storage
          python3 - <<'PY'
          import os
          import subprocess
          from urllib.parse import unquote

          uri = os.environ["SUPABASE_DB_URL"].strip()
          if uri.startswith("postgresql://"):
              raw = uri[len("postgresql://"):]
          elif uri.startswith("postgres://"):
              raw = uri[len("postgres://"):]
          else:
              raise SystemExit("SUPABASE_DB_URL must start with postgresql:// or postgres://")

          # Parse from the right so reserved characters inside the password do not
          # get mistaken for URI delimiters. Supabase session-pooler URIs have the
          # shape user:password@host:port/database.
          authority, database = raw.rsplit("/", 1)
          userinfo, hostport = authority.rsplit("@", 1)
          username, password = userinfo.split(":", 1)
          host, port = hostport.rsplit(":", 1)

          username = unquote(username)
          password = unquote(password)
          database = unquote(database.split("?", 1)[0]) or "postgres"

          if not host.endswith(".pooler.supabase.com"):
              raise SystemExit("SUPABASE_DB_URL is not a Supabase pooler URI")

          env = os.environ.copy()
          env["PGPASSWORD"] = password
          env["PGSSLMODE"] = "require"

          common = [
              "pg_dump",
              f"--host={host}",
              f"--port={port}",
              f"--username={username}",
              f"--dbname={database}",
              "--no-owner",
              "--no-acl",
          ]

          subprocess.run(
              common + ["--format=custom", "--file=backup/database/imobiliarias.dump"],
              env=env,
              check=True,
          )
          subprocess.run(
              common + ["--schema-only", "--file=backup/database/schema.sql"],
              env=env,
              check=True,
          )
          PY

      - name: Backup Storage objects
        shell: bash
        run: python3 scripts/backup_supabase_storage.py backup/storage

      - name: Write manifest
        shell: bash
        run: |
          printf 'commit=%s\ncreated_utc=%s\nproject=rvjsonspplqelktzwusu\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > backup/MANIFEST.txt
          find backup/storage -type f | sort > backup/STORAGE_FILES.txt
          sha256sum backup/database/imobiliarias.dump backup/database/schema.sql > backup/SHA256SUMS.txt

      - name: Upload retention artifact
        uses: actions/upload-artifact@v4
        with:
          name: imobiliarias-supabase-backup-${{ github.run_id }}
          path: backup/
          if-no-files-found: error
          retention-days: 14
