# Backup operacional lógico do Supabase IMOBILIARIAS
name: Backup Supabase

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: backup-supabase
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://rvjsonspplqelktzwusu.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate backup secret
        shell: bash
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing SUPABASE_SERVICE_ROLE_KEY secret"; exit 1; }

      - name: Export application data
        shell: bash
        run: |
          mkdir -p backup/database backup/storage backup/schema
          python3 scripts/backup_supabase_data.py backup/database

      - name: Backup Storage objects
        shell: bash
        run: python3 scripts/backup_supabase_storage.py backup/storage

      - name: Preserve schema migrations
        shell: bash
        run: |
          mkdir -p backup/schema
          cp -a supabase/migrations backup/schema/migrations
          if [ -f supabase/config.toml ]; then cp supabase/config.toml backup/schema/config.toml; fi

      - name: Write manifest and checksums
        shell: bash
        run: |
          printf 'backup_type=logical-operational\ncommit=%s\ncreated_utc=%s\nproject=rvjsonspplqelktzwusu\nrestore_schema_from=supabase/migrations\nauth_passwords_included=no\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > backup/MANIFEST.txt
          find backup/storage -type f | sort > backup/STORAGE_FILES.txt
          find backup -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > backup/SHA256SUMS.txt

      - name: Upload retention artifact
        uses: actions/upload-artifact@v4
        with:
          name: imobiliarias-supabase-backup-${{ github.run_id }}
          path: backup/
          if-no-files-found: error
          retention-days: 14
