# Backup operacional lógico do Supabase IMOBILIARIAS
name: Backup Supabase

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backup-supabase.yml"
      - "scripts/backup_supabase_data.py"
      - "scripts/backup_supabase_storage.py"
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: backup-supabase
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://rvjsonspplqelktzwusu.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Run logical backup
        id: logical_backup
        shell: bash
        run: |
          set +e
          mkdir -p backup/database backup/storage backup/schema backup/logs

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" > backup/logs/data.log
            DATA_EXIT=99
          else
            python3 scripts/backup_supabase_data.py backup/database > backup/logs/data.log 2>&1
            DATA_EXIT=$?
          fi

          if [ "$DATA_EXIT" -eq 0 ]; then
            python3 scripts/backup_supabase_storage.py backup/storage > backup/logs/storage.log 2>&1
            STORAGE_EXIT=$?
          else
            echo "Skipped because data export failed." > backup/logs/storage.log
            STORAGE_EXIT=98
          fi

          if [ -d supabase/migrations ]; then
            cp -a supabase/migrations backup/schema/migrations
            SCHEMA_EXIT=0
          else
            echo "supabase/migrations directory missing" > backup/logs/schema.log
            SCHEMA_EXIT=97
          fi
          if [ -f supabase/config.toml ]; then cp supabase/config.toml backup/schema/config.toml; fi

          printf 'backup_type=logical-operational\ncommit=%s\ncreated_utc=%s\nproject=rvjsonspplqelktzwusu\nrestore_schema_from=supabase/migrations\nauth_passwords_included=no\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > backup/MANIFEST.txt
          (
            cd backup || exit 96
            find storage -type f | sort > STORAGE_FILES.txt
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #' > SHA256SUMS.txt
          )

          echo "data_exit=$DATA_EXIT" >> "$GITHUB_OUTPUT"
          echo "storage_exit=$STORAGE_EXIT" >> "$GITHUB_OUTPUT"
          echo "schema_exit=$SCHEMA_EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload backup artifact
        if: steps.logical_backup.outputs.data_exit == '0' && steps.logical_backup.outputs.storage_exit == '0' && steps.logical_backup.outputs.schema_exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: imobiliarias-supabase-backup-${{ github.run_id }}
          path: backup/
          if-no-files-found: error
          retention-days: 14

      - name: Record backup status
        shell: bash
        env:
          DATA_EXIT: ${{ steps.logical_backup.outputs.data_exit }}
          STORAGE_EXIT: ${{ steps.logical_backup.outputs.storage_exit }}
          SCHEMA_EXIT: ${{ steps.logical_backup.outputs.schema_exit }}
        run: |
          mkdir -p docs
          if [ "$DATA_EXIT" = "0" ] && [ "$STORAGE_EXIT" = "0" ] && [ "$SCHEMA_EXIT" = "0" ]; then
            RESULT="SUCCESS"
          else
            RESULT="FAILURE"
          fi
          {
            echo "# Supabase Backup Status"
            echo
            echo "- Result: **$RESULT**"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Run: \`$GITHUB_RUN_ID\`"
            echo "- Checked at UTC: \`$(date -u +%FT%TZ)\`"
            echo "- Data export exit: \`$DATA_EXIT\`"
            echo "- Storage export exit: \`$STORAGE_EXIT\`"
            echo "- Schema copy exit: \`$SCHEMA_EXIT\`"
            echo
            echo "## Diagnostic tail"
            echo '```text'
            echo "[data]"
            tail -n 12 backup/logs/data.log 2>/dev/null || true
            echo "[storage]"
            tail -n 12 backup/logs/storage.log 2>/dev/null || true
            echo "[schema]"
            tail -n 12 backup/logs/schema.log 2>/dev/null || true
            echo '```'
          } > docs/BACKUP-STATUS.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BACKUP-STATUS.md
          git diff --cached --quiet || git commit -m "chore: record Supabase backup status [skip netlify]"
          git push

      - name: Fail workflow when backup is incomplete
        if: steps.logical_backup.outputs.data_exit != '0' || steps.logical_backup.outputs.storage_exit != '0' || steps.logical_backup.outputs.schema_exit != '0'
        shell: bash
        run: exit 1
