name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_ALLOW_INDEXING: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration numbering
        shell: bash
        run: |
          duplicates="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]+)_.*/\1/' | sort | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "Duplicate migration number(s): $duplicates"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Validate environment contract
        run: pnpm env:contract
      - name: Validate homologation safety assets
        run: pnpm homologation:assets
      - name: Validate migration safety
        run: pnpm migration:safety
      - name: Validate privileged Edge Function guards
        run: pnpm edge:guards
      - run: pnpm --filter @imobiliarias/web typecheck
      - run: pnpm --filter @imobiliarias/web build
      - run: pnpm --filter @imobiliarias/mobile typecheck
