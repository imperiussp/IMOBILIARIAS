name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_ALLOW_INDEXING: "false"
      NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
      NEXT_PUBLIC_BUILD_LABEL: ci-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration numbering
        shell: bash
        run: |
          duplicates="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]+)_.*/\1/' | sort | uniq -d)"
          # 0141 is a known historical collision: both migrations were already applied
          # independently in production under distinct timestamped Supabase versions.
          unexpected="$(printf '%s\n' "$duplicates" | grep -v -x '0141' || true)"
          if [ -n "$unexpected" ]; then
            echo "Duplicate migration number(s): $unexpected"
            exit 1
          fi
          if printf '%s\n' "$duplicates" | grep -q -x '0141'; then
            echo "Known historical duplicate migration number 0141 accepted."
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Validate smoke script syntax
        run: node --check scripts/post-deploy-smoke.mjs
      - name: Run release validation suite
        run: pnpm release:validate
