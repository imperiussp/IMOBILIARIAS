name: Check cPanel secrets temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-cpanel-secrets-temp.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured secrets
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "$CPANEL_HOST" ]; then echo "CPANEL_HOST_SET=yes"; else echo "CPANEL_HOST_SET=no"; fi
          if [ -n "$CPANEL_USER" ]; then echo "CPANEL_USER_SET=yes"; else echo "CPANEL_USER_SET=no"; fi
          if [ -n "$CPANEL_API_TOKEN" ]; then echo "CPANEL_API_TOKEN_SET=yes"; else echo "CPANEL_API_TOKEN_SET=no"; fi
