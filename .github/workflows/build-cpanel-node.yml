name: Build cPanel Node package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-cpanel-node.yml"

permissions:
  contents: write

concurrency:
  group: cpanel-standalone-package
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_URL: "https://imoveis.lenoy.com.br"
  NEXT_PUBLIC_ALLOW_INDEXING: "true"
  NEXT_PUBLIC_SUPABASE_URL: "https://rvjsonspplqelktzwusu.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_jhqdOH3X4FPkxjKTY-EnUQ_37mUhy4z"
  IMOBILIARIAS_SUPABASE_PROJECT_REF: "rvjsonspplqelktzwusu"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve previous cPanel package
        shell: bash
        run: |
          set -euo pipefail
          if [ -f cpanel-node-build/imobiliarias-standalone-cpanel.zip ]; then
            cp cpanel-node-build/imobiliarias-standalone-cpanel.zip /tmp/imobiliarias-previous-cpanel.zip
          fi
      - name: Install all build dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build standalone production runtime
        env:
          NODE_ENV: production
          CPANEL_STANDALONE: "1"
        run: pnpm --filter @imobiliarias/web build
      - name: Assemble standalone and incremental packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cpanel-node-build package-cpanel previous-cpanel current-cpanel update-cpanel
          mkdir -p cpanel-node-build package-cpanel
          STANDALONE="apps/web/.next/standalone"
          test -d "$STANDALONE"
          cp -a "$STANDALONE"/. package-cpanel/
          SERVER=""
          if [ -f package-cpanel/apps/web/server.js ]; then
            SERVER="package-cpanel/apps/web/server.js"
          elif [ -f package-cpanel/server.js ]; then
            SERVER="package-cpanel/server.js"
          else
            SERVER="$(find package-cpanel -type f -name server.js | head -n 1)"
          fi
          test -n "$SERVER"
          SERVER_DIR="$(dirname "$SERVER")"
          mkdir -p "$SERVER_DIR/.next/static"
          cp -a apps/web/.next/static/. "$SERVER_DIR/.next/static/"
          if [ -d apps/web/public ]; then
            rm -rf "$SERVER_DIR/public"
            cp -a apps/web/public "$SERVER_DIR/public"
          fi
          if [ "$SERVER_DIR" != "package-cpanel" ]; then
            cat > package-cpanel/server.js <<EOF
          process.chdir(__dirname + '/${SERVER_DIR#package-cpanel/}');
          require('./${SERVER_DIR#package-cpanel/}/server.js');
          EOF
          fi
          printf "commit=%s\nbuilt_at=%s\nmode=standalone\n" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > package-cpanel/cpanel-build.txt
          mkdir -p package-cpanel/tmp
          printf "restart=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > package-cpanel/tmp/restart.txt

          cd package-cpanel
          zip -qr ../cpanel-node-build/imobiliarias-standalone-cpanel.zip . -x "*.log"
          cd ..

          mkdir -p current-cpanel update-cpanel
          unzip -q cpanel-node-build/imobiliarias-standalone-cpanel.zip -d current-cpanel
          if [ -f /tmp/imobiliarias-previous-cpanel.zip ]; then
            mkdir -p previous-cpanel
            unzip -q /tmp/imobiliarias-previous-cpanel.zip -d previous-cpanel
            rsync -a --checksum --compare-dest="$GITHUB_WORKSPACE/previous-cpanel/" current-cpanel/ update-cpanel/
          else
            cp -a current-cpanel/. update-cpanel/
          fi

          DEPS_CHANGED=0
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD -- package.json pnpm-lock.yaml pnpm-workspace.yaml 'packages/**/package.json' 'apps/web/package.json' | grep -q .; then
              DEPS_CHANGED=1
            fi
          fi
          if [ "$DEPS_CHANGED" = "0" ]; then
            find update-cpanel -type d -name node_modules -prune -exec rm -rf {} + || true
          fi

          cd update-cpanel
          zip -qr ../cpanel-node-build/imobiliarias-update-cpanel.zip . -x "*.log"
          cd ..
          echo "Pacote completo:"
          du -h cpanel-node-build/imobiliarias-standalone-cpanel.zip
          echo "Pacote incremental:"
          du -h cpanel-node-build/imobiliarias-update-cpanel.zip
          echo "Dependências alteradas: $DEPS_CHANGED"

      - name: Upload cPanel Node packages
        uses: actions/upload-artifact@v4
        with:
          name: imobiliarias-cpanel-node
          path: |
            cpanel-node-build/imobiliarias-standalone-cpanel.zip
            cpanel-node-build/imobiliarias-update-cpanel.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish cPanel packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cpanel-node-build/imobiliarias-standalone-cpanel.zip cpanel-node-build/imobiliarias-update-cpanel.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: publish cPanel packages [skip netlify]"
          git reset --hard HEAD
          git pull --rebase origin main
          git push
