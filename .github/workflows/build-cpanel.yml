name: Build cPanel package

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/build-cpanel.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpanel-package
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CPANEL_EXPORT: "1"
      NEXT_PUBLIC_SITE_URL: "https://imoveis.lenoy.com.br"
      NEXT_PUBLIC_ALLOW_INDEXING: "true"
      NEXT_PUBLIC_SUPABASE_URL: "https://rvjsonspplqelktzwusu.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_jhqdOH3X4FPkxjKTY-EnUQ_37mUhy4z"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Prepare static build
        run: |
          rm -rf apps/web/app/api
          mkdir -p cpanel-build
      - name: Build and publish diagnostic/package
        run: |
          set +e
          pnpm build:web > cpanel-build/build.log 2>&1
          CODE=$?
          echo "$CODE" > cpanel-build/status.txt
          if [ "$CODE" -eq 0 ]; then
            cat > apps/web/out/.htaccess <<'EOF'
          Options -Indexes
          DirectoryIndex index.html
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^(.+[^/])$ $1/ [R=301,L]
          <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
          </IfModule>
          EOF
            printf "cpanel_build=%s\nbuilt_at=%s\n" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > apps/web/out/cpanel-build.txt
            (cd apps/web/out && zip -qr ../../../cpanel-build/imobiliarias-cpanel.zip .)
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cpanel-build/status.txt cpanel-build/build.log
          [ -f cpanel-build/imobiliarias-cpanel.zip ] && git add -f cpanel-build/imobiliarias-cpanel.zip
          git commit -m "build: cPanel package result [skip netlify]" || true

          # O workflow Node também publica artefatos no main. Se ele avançar a branch
          # enquanto esta build estática roda, rebaseamos o commit do pacote antes de enviar.
          if ! git diff --quiet HEAD^ HEAD 2>/dev/null; then
            PUBLISHED=0
            for ATTEMPT in 1 2 3; do
              git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
              if git push origin HEAD:main; then
                PUBLISHED=1
                break
              fi
              sleep 2
            done
            if [ "$PUBLISHED" -ne 1 ]; then
              echo "Falha ao publicar o pacote estático no main após 3 tentativas."
              exit 1
            fi
          fi
          exit "$CODE"
      - name: Upload cPanel package artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: imobiliarias-cpanel
          path: cpanel-build/imobiliarias-cpanel.zip
          if-no-files-found: error
          retention-days: 7
