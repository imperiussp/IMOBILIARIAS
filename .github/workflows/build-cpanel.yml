name: Build cPanel package

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/build-cpanel.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpanel-package
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CPANEL_EXPORT: "1"
  NEXT_PUBLIC_SITE_URL: "https://imoveis.lenoy.com.br"
  NEXT_PUBLIC_ALLOW_INDEXING: "true"
  NEXT_PUBLIC_SUPABASE_URL: "https://rvjsonspplqelktzwusu.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_jhqdOH3X4FPkxjKTY-EnUQ_37mUhy4z"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Prepare static build
        run: |
          rm -rf apps/web/app/api
          mkdir -p cpanel-build
      - name: Build and publish diagnostic/package
        run: |
          set +e
          pnpm build:web > cpanel-build/build.log 2>&1
          CODE=$?
          echo "$CODE" > cpanel-build/status.txt
          if [ "$CODE" -eq 0 ]; then
            cat > apps/web/out/.htaccess <<'EOF'
          Options -Indexes
          DirectoryIndex index.html
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^(.+[^/])$ $1/ [R=301,L]
          <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            <FilesMatch "\.html$">
              Header always set Cache-Control "no-cache, no-store, must-revalidate, max-age=0"
              Header always set Pragma "no-cache"
              Header always set Expires "0"
            </FilesMatch>
            <Files "cpanel-build.txt">
              Header always set Cache-Control "no-cache, no-store, must-revalidate, max-age=0"
            </Files>
          </IfModule>
          EOF
            printf "cpanel_build=%s\nbuilt_at=%s\n" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > apps/web/out/cpanel-build.txt

            # Home de vendas: o hero deve usar diretamente a imagem hospedada no LENOY.
            # Não aceitar novamente Base64/WebP embutido no HTML.
            HERO_URL="https://lenoy.com.br/wp-content/uploads/2026/08/banner-imobi.jpg?v=20260830-hd-direct"
            if ! grep -Fq "$HERO_URL" apps/web/out/index.html; then
              echo "URL direta do hero não encontrada no index.html." >&2
              exit 41
            fi
            if grep -q "data:image/webp;base64," apps/web/out/index.html; then
              echo "Regressão detectada: hero voltou a ser embutido em Base64." >&2
              exit 45
            fi

            # Confirma apenas que a imagem remota existe e não veio vazia.
            if curl -fL --retry 3 --connect-timeout 10 --max-time 45 "$HERO_URL" -o /tmp/lenoy-hero.jpg; then
              HERO_BYTES="$(wc -c < /tmp/lenoy-hero.jpg | tr -d ' ')"
              echo "Hero remoto: ${HERO_BYTES} bytes"
              if [ "$HERO_BYTES" -lt 1000 ]; then
                echo "Hero remoto inválido (${HERO_BYTES} bytes)." >&2
                exit 46
              fi
            else
              echo "Não foi possível validar a imagem remota do hero." >&2
              exit 47
            fi

            HERO_CSS="$(grep -rl "background-size:auto 100%" apps/web/out/_next/static/css | head -n 1)"
            if [ -z "$HERO_CSS" ]; then
              echo "CSS responsivo protegido do hero não encontrado no export estático." >&2
              exit 43
            fi

            if ! grep -q "platformLanding.platformLanding" "$HERO_CSS"; then
              echo "Seletor protegido do hero não encontrado no CSS final." >&2
              exit 44
            fi

            (cd apps/web/out && zip -qr ../../../cpanel-build/imobiliarias-cpanel.zip .)

            # Patch leve: index gerado oficialmente + CSS de enquadramento.
            rm -rf cpanel-build/background-responsive
            rm -f cpanel-build/imobiliarias-background-responsive.zip
            mkdir -p cpanel-build/background-responsive/_next/static/css
            cp apps/web/out/index.html cpanel-build/background-responsive/index.html
            cp "$HERO_CSS" cpanel-build/background-responsive/_next/static/css/
            chmod 0644 \
              cpanel-build/background-responsive/index.html \
              cpanel-build/background-responsive/_next/static/css/"$(basename "$HERO_CSS")"
            (cd cpanel-build/background-responsive && zip -qr ../imobiliarias-background-responsive.zip .)
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cpanel-build/status.txt cpanel-build/build.log
          [ -f cpanel-build/imobiliarias-cpanel.zip ] && git add -f cpanel-build/imobiliarias-cpanel.zip
          [ -f cpanel-build/imobiliarias-background-responsive.zip ] && git add -f cpanel-build/imobiliarias-background-responsive.zip
          git commit -m "build: cPanel package result [skip netlify]" || true

          # A exportação remove app/api e gera arquivos locais. Eles não pertencem ao
          # commit do pacote e impedem um rebase. Limpamos o workspace somente depois
          # de o diagnóstico/ZIP já estar salvo no commit local.
          git reset --hard HEAD
          git clean -fd apps/web/out || true

          # Publicar o ZIP no main é apenas conveniência. A fonte oficial para instalação
          # é o artefato desta própria execução. Se outro workflow avançar a branch e
          # causar conflito, preservamos a build válida e seguimos para Upload Artifact.
          if ! git diff --quiet HEAD^ HEAD 2>/dev/null; then
            PUBLISHED=0
            for ATTEMPT in 1 2 3; do
              git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
              if git push origin HEAD:main; then
                PUBLISHED=1
                break
              fi
              sleep 2
            done
            if [ "$PUBLISHED" -ne 1 ]; then
              echo "Aviso: o commit automático do pacote não foi publicado; o artefato desta execução continua válido."
            fi
          fi
          exit "$CODE"
      - name: Upload cPanel package artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: imobiliarias-cpanel
          path: |
            cpanel-build/imobiliarias-cpanel.zip
            cpanel-build/imobiliarias-background-responsive.zip
          if-no-files-found: error
          retention-days: 7
