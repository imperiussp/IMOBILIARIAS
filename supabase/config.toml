# Configuração local/deploy das Edge Functions do projeto IMOBILIARIAS.
# Não reutilizar este arquivo para Moto Connect ou qualquer outro projeto.
#
# Endpoints públicos abaixo usam verify_jwt=false porque provedores externos e cron
# não possuem JWT do Supabase. A autenticação continua obrigatória dentro de cada
# função por assinatura ou segredo específico.

[functions.infinitepay-webhook]
verify_jwt = false

[functions.meta-whatsapp-webhook]
verify_jwt = false

[functions.resend-outreach-webhook]
verify_jwt = false

[functions.ingest-inbound-email]
verify_jwt = false

[functions.platform-maintenance]
verify_jwt = false

[functions.process-subscription-expiry]
verify_jwt = false

[functions.verify-custom-domains]
verify_jwt = false

[functions.push-broker-notifications]
verify_jwt = false

[functions.process-buyer-opportunities]
verify_jwt = false

[functions.deliver-buyer-outreach]
verify_jwt = false

[functions.buyer-outreach-health]
verify_jwt = false

[functions.buyer-outreach-webhook]
verify_jwt = false

# Ações iniciadas pelo usuário continuam exigindo sessão autenticada.
[functions.create-infinitepay-checkout]
verify_jwt = true

[functions.confirm-infinitepay-payment]
verify_jwt = true

[functions.generate-property-description]
verify_jwt = true

[functions.generate-buyer-opportunity-message]
verify_jwt = true
